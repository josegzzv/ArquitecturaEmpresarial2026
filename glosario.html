<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Glosario · Arquitectura Empresarial</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23b3400a'/><text y='68' x='50' text-anchor='middle' font-size='52' font-family='sans-serif' font-weight='bold' fill='white'>AE</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700&family=IBM+Plex+Mono&display=swap">
<link rel="stylesheet" href="assets/css/styles.css">
<script src="assets/js/nucleo.js"></script>
</head>
<body>

<header class="sitio"><div class="contenedor barra"></div></header>

<main>
  <div class="contenedor">
    <section class="hero">
      <div class="kicker">Referencia</div>
      <h1>Glosario del curso</h1>
      <p class="lead">Todos los términos, siglas y marcos que aparecen en el curso, con la semana en la que se ven.</p>
    </section>

    <div class="bloque" style="margin-bottom:1.2rem">
      <input id="buscar" type="search" placeholder="Buscar: TOGAF, proceso, gobierno, artefacto…"
             style="width:100%;font:inherit;padding:.6rem .8rem;border-radius:9px;border:1px solid var(--border);background:var(--surface-2);color:var(--text)">
    </div>

    <div id="glosario"></div>
  </div>
</main>

<footer class="sitio"><div class="contenedor"></div></footer>

<script src="data/curso.js"></script>
<script src="data/semana-1.js"></script>
<script src="data/semana-2.js"></script>
<script src="data/semana-3.js"></script>
<script src="data/semana-4.js"></script>
<script src="data/semana-5.js"></script>
<script src="assets/js/vistas.js"></script>
<script>
  EA.montarCascaron("glosario");
  EA.vistas.renderGlosario(document.getElementById("glosario"), document.getElementById("buscar"));
</script>
</body>
</html>
